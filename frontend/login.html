<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Tripster</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/styles.css">
</head>
<body class="text-gray-200 bg-slate-900 min-h-screen flex items-center justify-center">
    
    <div class="w-full max-w-md mx-auto px-4">
        <!-- Logo and Title -->
        <div class="text-center mb-8">
            <div class="flex items-center justify-center space-x-2 mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-10 h-10 text-purple-400">
                    <path d="M12.48 4.78a2.25 2.25 0 0 0-2.96 0L2.92 11.4a2.25 2.25 0 0 0 .15 3.32l8.15 5.43a2.25 2.25 0 0 0 2.8 0l8.15-5.43a2.25 2.25 0 0 0 .15-3.32l-6.6-6.62Z"/>
                    <path d="m18 16 4-3-4-3"/>
                    <path d="m6 16-4-3 4-3"/>
                </svg>
                <h1 class="text-3xl font-bold text-white">Tripster</h1>
            </div>
            <p class="text-gray-400">Your Smart Trip Planner</p>
        </div>

        <!-- Tabs for Login/Register -->
        <div class="bg-slate-800 rounded-2xl shadow-2xl p-8">
            <div class="flex border-b border-slate-700 mb-6">
                <button id="loginTab" class="flex-1 py-3 px-4 text-center font-semibold text-purple-400 border-b-2 border-purple-400 transition-colors">
                    Login
                </button>
                <button id="registerTab" class="flex-1 py-3 px-4 text-center font-semibold text-gray-400 hover:text-gray-300 transition-colors">
                    Register
                </button>
            </div>

            <!-- Login Form -->
            <div id="loginForm" class="space-y-4">
                <div>
                    <label for="loginUsername" class="block text-sm font-medium text-gray-300 mb-2">Username</label>
                    <input type="text" id="loginUsername" name="username" required
                        class="w-full px-4 py-3 bg-slate-700 border border-slate-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                        placeholder="Enter your username">
                </div>
                <div>
                    <label for="loginPassword" class="block text-sm font-medium text-gray-300 mb-2">Password</label>
                    <input type="password" id="loginPassword" name="password" required
                        class="w-full px-4 py-3 bg-slate-700 border border-slate-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                        placeholder="Enter your password">
                </div>
                <div id="loginError" class="hidden p-3 bg-red-900/40 border border-red-700 rounded-lg text-red-300 text-sm"></div>
                <button type="button" id="loginButton" 
                    class="w-full bg-purple-600 hover:bg-purple-700 text-white font-semibold py-3 px-4 rounded-lg transition-colors">
                    Login
                </button>
            </div>

            <!-- Register Form -->
            <div id="registerForm" class="hidden space-y-4">
                <div>
                    <label for="registerUsername" class="block text-sm font-medium text-gray-300 mb-2">Username</label>
                    <input type="text" id="registerUsername" name="username" required
                        class="w-full px-4 py-3 bg-slate-700 border border-slate-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                        placeholder="Choose a username">
                </div>
                <div>
                    <label for="registerEmail" class="block text-sm font-medium text-gray-300 mb-2">Email</label>
                    <input type="email" id="registerEmail" name="email" required
                        class="w-full px-4 py-3 bg-slate-700 border border-slate-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                        placeholder="Enter your email">
                </div>
                <div>
                    <label for="registerPassword" class="block text-sm font-medium text-gray-300 mb-2">Password</label>
                    <input type="password" id="registerPassword" name="password" required
                        class="w-full px-4 py-3 bg-slate-700 border border-slate-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                        placeholder="Choose a password">
                </div>
                <div>
                    <label for="registerPasswordConfirm" class="block text-sm font-medium text-gray-300 mb-2">Confirm Password</label>
                    <input type="password" id="registerPasswordConfirm" name="passwordConfirm" required
                        class="w-full px-4 py-3 bg-slate-700 border border-slate-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                        placeholder="Confirm your password">
                </div>
                <div id="registerError" class="hidden p-3 bg-red-900/40 border border-red-700 rounded-lg text-red-300 text-sm"></div>
                <div id="registerSuccess" class="hidden p-3 bg-green-900/40 border border-green-700 rounded-lg text-green-300 text-sm"></div>
                <button type="button" id="registerButton" 
                    class="w-full bg-purple-600 hover:bg-purple-700 text-white font-semibold py-3 px-4 rounded-lg transition-colors">
                    Register
                </button>
            </div>
        </div>

        <!-- Back to Home Link -->
        <div class="text-center mt-6">
            <a href="index.html" class="text-purple-400 hover:text-purple-300 text-sm">← Back to Home</a>
        </div>
    </div>

    <script src="assets/auth.js"></script>
</body>
</html>
